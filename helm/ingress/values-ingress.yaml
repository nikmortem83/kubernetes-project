controller:
  replicaCount: 1
  resources:
    limits:
      cpu: "1000m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  service:
    type: LoadBalancer
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: "ingress-nginx"
      interval: "30s"
defaultBackend:
  enabled: true
  replicaCount: 1
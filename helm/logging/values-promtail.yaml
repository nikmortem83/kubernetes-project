loki:
  serviceName: loki
  port: 3100

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push

pipelineStages:
  - json:
      expressions:
        level: level
        msg: msg

scrapeConfig:
  jobName: system-logs
  staticConfigs:
    - targets: ['localhost']
      labels:
        job: system
        __path__: /var/log/*.log

config:
  filewatcher:
    watch_config_files: false
  scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod

      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace]
          action: keep
          regex: boutique|istio-system

        - source_labels: [__meta_kubernetes_pod_label_app]
          action: drop
          regex: istio-ingressgateway|istio-egressgateway

# helm/logging/values-loki.yaml — singleBinary + локальное хранение, без баккетов

mode: singleBinary

# Отключаем компоненты, которые требуют bucketNames
write:
  enabled: false
read:
  enabled: false
distributor:
  enabled: false
queryFrontend:
  enabled: false
queryScheduler:
  enabled: false
indexGateway:
  enabled: false

# Локальное хранение (boltdb-shipper + filesystem) будет включено автоматически
storage:
  type: filesystem

# Никаких PVC — для minikube это нормально
persistence:
  enabled: false

# Отключаем лишние компоненты
ruler:
  enabled: false
compactor:
  enabled: false

limitsConfig:
  ingestionRate: 10MB
  ingestionBurstSize: 15MB
  queryTimeout: 30s

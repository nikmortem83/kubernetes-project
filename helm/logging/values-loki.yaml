loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2020-10-24"
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: loki_index_
          period: 24h

promtail:
  enabled: true
  config:
    snippets:
      extraScrapeConfigs: |
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
            - source_labels: [__meta_kubernetes_container_name]
              action: replace
              target_label: container
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - action: drop
              regex: .*
              # Можно добавить фильтрацию по namespace, если нужно

persistence:
  enabled: false

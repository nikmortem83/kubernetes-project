prometheus:
  prometheusSpec:

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: network-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi
    retention: "7d"
    replicas: 2

    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

alertmanager:
  alertmanagerSpec:
    replicas: 2
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: network-ssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "default"
    receivers:
      - name: "default"

grafana:
  enabled: true

  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: network-ssd
    size: 5Gi

  ingress:
    enabled: false

kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true

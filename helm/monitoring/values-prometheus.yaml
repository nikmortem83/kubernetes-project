prometheus:
  prometheusSpec:
    retention: "7d"
    resources:
      limits:
        cpu: "1000m"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"

alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "250m"
        memory: "256Mi"

grafana:
  enabled: true
  # в prod используем секреты
  adminPassword: "admin"
  ingress:
    enabled: true
    hosts:
      - grafana.local
    pathType: Prefix

kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
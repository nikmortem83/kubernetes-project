deploy-minikube:
  stage: deploy
  tags: [shell, minikube]
  script:
    - ./scripts/minikube.sh up
    - ./scripts/deploy-all.sh dev
  environment:
    name: dev
  rules:
    - if: '$DEPLOY_TARGET == "minikube" && $CI_COMMIT_BRANCH == "Kubernetes-project-dev"'

deploy-cloud:
  stage: deploy
  needs: [terraform-plan]
  script:
    - cd $TF_DIR
    - terraform apply -input=false -auto-approve tfplan
    - CLUSTER_ID=$(terraform output -raw cluster_id)
    - ~/.yandex-cloud/bin/yc managed-kubernetes cluster get-credentials --id $CLUSTER_ID --external
    - kubectl get nodes
    - cd "$CI_PROJECT_DIR"
    - ./scripts/deploy-all.sh prod
  environment:
    name: prod
  rules:
    - if: '$DEPLOY_TARGET == "cloud" && $CI_COMMIT_BRANCH == "Kubernetes-project-prod"'